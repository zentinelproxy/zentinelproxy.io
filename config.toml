# Zola configuration for Zentinel website
# https://www.getzola.org/documentation/getting-started/configuration/

base_url = "https://zentinelproxy.io"
title = "Zentinel"
description = "A security-first reverse proxy built on Pingora: explicit configuration, bounded resources, and WAF and auth in isolated agents."
default_language = "en"

# Compile Sass/SCSS
compile_sass = true

# Generate feed
generate_feeds = true
feed_filenames = ["atom.xml"]

# Build options
build_search_index = true
minify_html = true

# Taxonomies for agent tagging
taxonomies = [
    { name = "tags", feed = false }
]

[markdown]
smart_punctuation = true
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true

[markdown.highlighting]
style = "class"
dark_theme = "github-dark"
light_theme = "github-light"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_javascript"

[extra]
# Site metadata
author = "raskell.io"
github_repo = "https://github.com/zentinelproxy/zentinel"
docs_url = "https://docs.zentinelproxy.io/"
docs_external_url = "https://docs.zentinelproxy.io/"
# The current zentinel release (GitHub release tag, CalVer YY.MM_PATCH). It feeds
# the JSON-LD softwareVersion and the docker tags on /customize/. CI
# (.github/workflows/content-checks.yml, `mise run check-version`) fails when it
# is behind the latest release on github.com/zentinelproxy/zentinel.
software_version = "26.10_7"

# SEO metadata
keywords = "reverse proxy, security, Pingora, Cloudflare, Rust, WAF, KDL, agents"
# twitter_handle = "@raskell_io"  # Uncomment when Twitter handle is available

# Social links
github = "https://github.com/zentinelproxy/zentinel"
# discord = ""  # The previous invite (jN57RsT2) expired — Discord returns
# "Unknown Invite" (code 10006). Every template guards on this key, so the
# Discord links are simply hidden while it is unset. Restore by setting a
# permanent invite (Server Settings -> Invites -> expiry Never).

# Navigation (templates/base.html). Entries with children render as
# dropdowns (Explore, Learn), the rest as direct links. The GitHub link is the
# icon next to search, and "Install" is the call to action on the right.
[[extra.nav_links]]
